name: Build release executables

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pyinstaller imageio numpy scipy pycryptodome numba Pillow

      - name: Build native extensions
        run: |
          python setup-win.py build

      - name: Build executable
        run: |
          pyinstaller hstego-win.spec

      - name: Smoke test executable
        shell: pwsh
        run: |
          $executable = Get-ChildItem dist -Filter "hstego-*-win.amd64.exe" | Select-Object -First 1
          & $executable.FullName capacity testing\cover.png --raw

      - name: Show build output
        shell: pwsh
        run: |
          Get-ChildItem -Recurse dist

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: hstego-windows
          path: dist/*.exe

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libjpeg-dev python3-tk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pyinstaller imageio numpy scipy pycryptodome numba Pillow

      - name: Build native extensions
        run: |
          python setup.py build

      - name: Build executable
        run: |
          pyinstaller hstego-linux.spec

      - name: Show build output
        run: |
          ls -l dist

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: hstego-linux
          path: dist/hstego-*-linux.x86_64

  release:
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/**/*
